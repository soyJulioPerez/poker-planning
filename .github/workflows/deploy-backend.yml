name: Deploy backend to AWS (manual)

# Solo manual. El deploy automático vive en ci.yml, detrás de la verificación y
# acotado por el grafo de Nx.
#
# Este workflow existe para el camino que NO debe verificar la rama actual:
# desplegar un tag anterior para hacer rollback, o forzar un ambiente puntual.
# Verificar el código de la rama sería incorrecto — no es el que se despliega.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente a desplegar'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
      ref:
        description: >
          Ref (tag o commit) a desplegar. Opcional — por defecto usa el commit que
          disparó el workflow. Sirve para rollback de prod sin mover la rama master
          (ej. "v1.4.0").
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      # Ya no hace falta deducir el ambiente de la rama: este workflow es solo manual,
      # así que siempre viene del input.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      # Mismo target que usa ci.yml, para que el camino manual y el automático
      # desplieguen exactamente igual.
      - name: Deploy
        run: npx nx deploy realtime-api --configuration=${{ github.event.inputs.environment }} --outputStyle=static
        env:
          PATH: ${{ github.workspace }}/node_modules/.bin:${{ env.PATH }}
