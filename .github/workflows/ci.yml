name: CI

# Portón de verificación y, detrás de él, los deploys.
#
# Todo pasa por un mismo workflow a propósito: los jobs de deploy dependen del de
# verificación (`needs:`) y se acotan con `if:` al grafo de Nx. Así nada se despliega
# sin haber pasado lint/test/build, y nada se redespliega si no cambió.
#
# El camino manual (rollback, elegir ambiente) vive en deploy-backend.yml y
# deploy-web.yml, que quedaron solo con workflow_dispatch: al desplegar un tag viejo
# no corresponde verificar el código actual de la rama.

on:
  push:
    branches:
      - develop
      - master
      - 'release/**'
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Solo se cancela en pull requests, donde tres pushes seguidos no deberían dejar
  # tres pipelines completos corriendo.
  #
  # En push a develop/release/master NO se cancela: esta cancelación es a nivel de
  # workflow y se lleva puesta la corrida entera, incluidos los jobs de deploy. Un
  # `sam deploy` cancelado a mitad deja un changeset de CloudFormation aplicándose
  # sin nadie esperándolo. El `cancel-in-progress: false` de los jobs no alcanza:
  # protege de dos deploys simultáneos, no de que cancelen el suyo desde arriba.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      # Proyectos afectados que además tienen target `deploy`. Se calcula una sola
      # vez acá y lo consumen los dos jobs de abajo.
      deployable: ${{ steps.affected.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
        with:
          # `affected` necesita historia de git completa; tree:0 la trae sin blobs.
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Calcula el SHA base contra el último commit verificado con éxito.
      #
      # `main-branch-name` es obligatorio acá: su default es "main", que no existe
      # en este repo. Sin encontrarla, la action cae al hash del árbol vacío
      # (4b825dc...) y `affected` marca TODO como afectado — lo que en un pipeline
      # con deploys significa desplegar sin que haya cambiado nada.
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: develop

      - run: npx nx affected -t lint test build --outputStyle=static

      - id: affected
        run: echo "projects=$(npx nx show projects --affected --with-target deploy --json)" >> "$GITHUB_OUTPUT"

  deploy-backend:
    needs: verify
    if: >-
      contains(fromJSON(needs.verify.outputs.deployable), 'realtime-api')
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - uses: aws-actions/setup-sam@v2

      # master → prod, release/** → qa
      - run: npx nx deploy realtime-api --configuration=${{ github.ref == 'refs/heads/master' && 'prod' || 'qa' }} --outputStyle=static

  deploy-web:
    needs: verify
    if: >-
      contains(fromJSON(needs.verify.outputs.deployable), 'web')
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # El target hace el build con la configuración `aws` (que ya trae el baseHref)
      # y agrega el 404.html del fallback SPA.
      - run: npx nx deploy web --outputStyle=static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/web/browser

      - id: deployment
        uses: actions/deploy-pages@v4
