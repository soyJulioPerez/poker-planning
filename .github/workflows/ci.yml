name: CI

# Portón de verificación y, detrás de él, los deploys.
#
# Todo pasa por un mismo workflow a propósito: los jobs de deploy dependen del de
# verificación (`needs:`) y se acotan con `if:` al grafo de Nx. Así nada se despliega
# sin haber pasado lint/test/build, y nada se redespliega si no cambió.
#
# El camino manual (rollback, elegir ambiente) vive en deploy-backend.yml y
# deploy-web.yml, que quedaron solo con workflow_dispatch: al desplegar un tag viejo
# no corresponde verificar el código actual de la rama.

on:
  push:
    branches:
      - develop
      - master
      - 'release/**'
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Solo se cancela en pull requests, donde tres pushes seguidos no deberían dejar
  # tres pipelines completos corriendo.
  #
  # En push a develop/release/master NO se cancela: esta cancelación es a nivel de
  # workflow y se lleva puesta la corrida entera, incluidos los jobs de deploy. Un
  # `sam deploy` cancelado a mitad deja un changeset de CloudFormation aplicándose
  # sin nadie esperándolo. El `cancel-in-progress: false` de los jobs no alcanza:
  # protege de dos deploys simultáneos, no de que cancelen el suyo desde arriba.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      # Proyectos afectados que además tienen target `deploy`. Se calcula una sola
      # vez acá y lo consumen los dos jobs de abajo.
      deployable: ${{ steps.affected.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
        with:
          # `affected` necesita historia de git completa; tree:0 la trae sin blobs.
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Calcula el SHA base contra el último commit verificado con éxito.
      #
      # `main-branch-name` es obligatorio acá: su default es "main", que no existe
      # en este repo. Sin encontrarla, la action cae al hash del árbol vacío
      # (4b825dc...) y `affected` marca TODO como afectado — lo que en un pipeline
      # con deploys significa desplegar sin que haya cambiado nada.
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: develop

      # En push a `master`, la base que calcula la action no sirve.
      #
      # Para `nx-set-shas`, `master` no es la rama principal —`main-branch-name` es
      # `develop`— así que le calcula la base como el **merge-base contra `develop`**. Eso
      # se rompe con el propio flujo de release del repo: si el sync de vuelta a `develop`
      # ocurre antes de promover a `master`, las dos ramas apuntan al mismo commit, el
      # merge-base ES el HEAD, y el diff queda vacío. `affected` no devuelve nada, los
      # deploys se saltean y **la corrida queda verde sin desplegar** — el peor modo de
      # falla posible para un release.
      #
      # Pasó de verdad al promover v1.4.0: NX_BASE == NX_HEAD == 32aee6c y producción se
      # quedó en v1.3.1 con el check en verde.
      #
      # `master` solo avanza por fast-forward desde una rama de release, así que
      # `github.event.before` —el commit al que apuntaba antes del push— es exactamente la
      # base correcta, y no depende de dónde esté `develop`.
      #
      # Se pierde la propiedad de "último commit verificado con éxito" que da la action: si
      # un push a `master` falla y el siguiente lo arregla, el contenido del primero no se
      # reevalúa. Es aceptable porque `master` se mueve pocas veces y de forma deliberada, y
      # porque el camino manual (`deploy-backend.yml`, `deploy-web.yml`) cubre ese hueco.
      - name: Base correcta en master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "Sin commit previo utilizable en master; se conserva la base de nx-set-shas ($NX_BASE)"
          else
            echo "NX_BASE=$before" >> "$GITHUB_ENV"
            echo "Base en master: $before (era $NX_BASE)"
          fi

      - run: npx nx affected -t lint test build --outputStyle=static

      - id: affected
        run: echo "projects=$(npx nx show projects --affected --with-target deploy --json)" >> "$GITHUB_OUTPUT"

  e2e:
    # Corre EN PARALELO con `verify`, no detrás: los e2e son la etapa más lenta del
    # portón y ponerlos en serie demoraría el feedback de lint/test sin ganar nada.
    #
    # Y deliberadamente NO lleva `if:` a nivel de job. En GitHub Actions un job salteado
    # arrastra a sus dependientes al mismo estado, así que un `if:` acá dejaría a
    # deploy-backend y deploy-web en `skipped` cada vez que el cambio no tocara los e2e
    # — un deploy que no corre sin que nada quede en rojo. En vez de eso el job siempre
    # arranca, calcula su propio alcance y termina en verde sin hacer nada cuando no
    # corresponde. El costo es un `npm ci` de más; como es paralelo, en tiempo de pared
    # es cero.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Mismo cálculo de base que `verify`: sin `main-branch-name` la action cae al hash
      # del árbol vacío y marca todo como afectado.
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: develop

      # En push a `master`, la base que calcula la action no sirve.
      #
      # Para `nx-set-shas`, `master` no es la rama principal —`main-branch-name` es
      # `develop`— así que le calcula la base como el **merge-base contra `develop`**. Eso
      # se rompe con el propio flujo de release del repo: si el sync de vuelta a `develop`
      # ocurre antes de promover a `master`, las dos ramas apuntan al mismo commit, el
      # merge-base ES el HEAD, y el diff queda vacío. `affected` no devuelve nada, los
      # deploys se saltean y **la corrida queda verde sin desplegar** — el peor modo de
      # falla posible para un release.
      #
      # Pasó de verdad al promover v1.4.0: NX_BASE == NX_HEAD == 32aee6c y producción se
      # quedó en v1.3.1 con el check en verde.
      #
      # `master` solo avanza por fast-forward desde una rama de release, así que
      # `github.event.before` —el commit al que apuntaba antes del push— es exactamente la
      # base correcta, y no depende de dónde esté `develop`.
      #
      # Se pierde la propiedad de "último commit verificado con éxito" que da la action: si
      # un push a `master` falla y el siguiente lo arregla, el contenido del primero no se
      # reevalúa. Es aceptable porque `master` se mueve pocas veces y de forma deliberada, y
      # porque el camino manual (`deploy-backend.yml`, `deploy-web.yml`) cubre ese hueco.
      - name: Base correcta en master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "Sin commit previo utilizable en master; se conserva la base de nx-set-shas ($NX_BASE)"
          else
            echo "NX_BASE=$before" >> "$GITHUB_ENV"
            echo "Base en master: $before (era $NX_BASE)"
          fi

      # `e2e` declara `implicitDependencies: ["web", "realtime-api"]`, así que aparece acá
      # cuando cambia cualquiera de las dos apps o algo de lo que dependan.
      - id: scope
        run: |
          projects=$(npx nx show projects --affected --with-target e2e --json)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Proyectos con target e2e afectados: $projects"

      # `npm ci` instala la librería de Playwright, no los navegadores. Sin este paso los
      # tests fallan con "Executable doesn't exist", que no dice nada sobre la causa.
      - if: contains(fromJSON(steps.scope.outputs.projects), 'e2e')
        run: npx playwright install --with-deps chromium

      # La base de datos queda fuera de `webServer` de Playwright a propósito: es un
      # contenedor, no un proceso hijo. Se reutiliza el script del repo en vez de duplicar
      # el comando acá, para que local y CI no se desincronicen.
      - if: contains(fromJSON(steps.scope.outputs.projects), 'e2e')
        run: npm run e2e:db:up

      # Las dos apps se levantan desde sus bundles (ver el modo `ci` de
      # playwright.config.mts), así que hay que construirlas antes. Los comandos del
      # `webServer` son a propósito opacos para Nx —`http-server` y `node`, nunca `nx`—
      # porque el plugin infiere un `dependsOn` de cualquier comando `nx` que encuentre
      # ahí y termina invocando la misma tarea dos veces.
      - if: contains(fromJSON(steps.scope.outputs.projects), 'e2e')
        run: npx nx run-many -t build -p web realtime-api --outputStyle=static

      # El target no atomizado. `e2e-ci` divide por archivo de spec para repartir entre
      # agentes de Nx Cloud; sin agentes corren igual de serie y cada uno vuelve a levantar
      # web y api desde cero.
      - if: contains(fromJSON(steps.scope.outputs.projects), 'e2e')
        env:
          E2E_TARGET: ci
        run: npx nx e2e e2e --outputStyle=static

      # `always()` y no `failure()`: el reporte de una corrida verde sirve para ver cuánto
      # tardó cada test, que es el dato con el que después se decide si hace falta subir
      # `workers`. El preset deja todo bajo dist/.playwright/e2e.
      - if: always() && contains(fromJSON(steps.scope.outputs.projects), 'e2e')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/e2e/
          retention-days: 7

  deploy-backend:
    needs: [verify, e2e]
    if: >-
      contains(fromJSON(needs.verify.outputs.deployable), 'realtime-api')
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - uses: aws-actions/setup-sam@v2

      # master → prod, release/** → qa
      - run: npx nx deploy realtime-api --configuration=${{ github.ref == 'refs/heads/master' && 'prod' || 'qa' }} --outputStyle=static

  deploy-web:
    needs: [verify, e2e]
    if: >-
      contains(fromJSON(needs.verify.outputs.deployable), 'web')
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # El target hace el build con la configuración `aws` (que ya trae el baseHref)
      # y agrega el 404.html del fallback SPA.
      - run: npx nx deploy web --outputStyle=static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/web/browser

      - id: deployment
        uses: actions/deploy-pages@v4
