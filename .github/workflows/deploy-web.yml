name: Deploy web to GitHub Pages (manual)

# Solo manual. La publicación automática vive en ci.yml, detrás de la verificación
# y condicionada a que `web` esté afectada según el grafo de Nx.
#
# Antes este workflow corría en cada push a master sin filtro alguno, así que
# republicaba el sitio aunque el cambio hubiera sido solo del backend o de docs.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El target hace el build con la configuración `aws` y agrega el 404.html.
      #
      # A diferencia de deploy-backend.yml, acá SÍ se usa el target de Nx: este
      # workflow no tiene input `ref`, así que se dispara sobre el código actual de
      # la rama elegida. La salvedad: `workflow_dispatch` permite elegir un tag desde
      # la UI de GitHub, y si se elige uno anterior a v1.1.0 —cuando se agregó el
      # target— esto falla con "Cannot find configuration for task web:deploy".
      #
      # No hay un flujo de rollback de web documentado (a diferencia del backend, que
      # tiene input `ref` justamente para eso): para revertir la web se revierte el
      # commit y se vuelve a desplegar desde master.
      - name: Build y preparar artefacto
        run: npx nx deploy web --outputStyle=static

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/web/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Versión desplegada
        if: always()
        run: |
          git fetch --tags --force --quiet
          echo "### Versión desplegada: \`$(git describe --tags --always)\`" >> "$GITHUB_STEP_SUMMARY"
