version = 0.1

[default.deploy.parameters]
stack_name = "poker-planning-dev"
region = "us-east-2"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false

# Ambientes (ver openspec/changes/add-multi-environment-deployment). Los 3 stacks se
# crean desde cero (el stack único anterior, "poker-planning-dev", fue eliminado) —
# no hay migración de datos ni orden de despliegue obligatorio entre ellos.
[dev.deploy.parameters]
stack_name = "poker-planning-dev"
region = "us-east-2"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Environment=dev"

[qa.deploy.parameters]
stack_name = "poker-planning-qa"
region = "us-east-2"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Environment=qa"

[prod.deploy.parameters]
stack_name = "poker-planning-prod"
region = "us-east-2"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Environment=prod"
