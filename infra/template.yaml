AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Planning Poker - WebSocket API + Lambda + DynamoDB

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - prod
    Description: >
      Ambiente de despliegue. Determina el nombre físico de la tabla DynamoDB,
      la API Gateway y el stage, para evitar colisiones de nombre entre los
      stacks de dev/qa/prod en la misma cuenta y región. El sufijo aplica por
      igual a los 3 ambientes, incluido "dev" — desplegar este cambio sobre el
      stack dev ya existente reemplaza su tabla DynamoDB (TableName es una
      propiedad create-only en CloudFormation, no se puede renombrar in-place),
      lo cual borra las salas que existan en ese momento. Aceptado a propósito:
      las salas son efímeras (TTL, sin historial entre sesiones).

  NotificationEmail:
    Type: String
    Description: >
      Destino de las alarmas de CloudWatch. SNS manda un link de confirmacion
      a esta direccion tras el deploy; hasta que se confirma a mano, ninguna
      notificacion se entrega.

Mappings:
  LogRetention:
    dev:
      Days: 7
    qa:
      Days: 7
    prod:
      Days: 14
  AlarmThresholds:
    dev:
      LambdaErrorsPerFiveMin: 3
      IntegrationErrorsPerFiveMin: 3
    qa:
      LambdaErrorsPerFiveMin: 3
      IntegrationErrorsPerFiveMin: 3
    prod:
      LambdaErrorsPerFiveMin: 1
      IntegrationErrorsPerFiveMin: 1

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref RoomsTable
        DYNAMODB_ENDPOINT: ''

Resources:
  RoomsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'poker-planning-rooms-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'poker-planning-ws-${Environment}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub 'integrations/${ConnectIntegration}'

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations

  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${DisconnectIntegration}'

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub 'integrations/${DefaultIntegration}'

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DefaultFunction.Arn}/invocations

  DefaultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DefaultFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  # Un log group por funcion, declarado como recurso propio del stack. No es solo para
  # fijar la retencion (SAM no tiene atajo para eso en AWS::Serverless::Function, hay que
  # declarar el AWS::Logs::LogGroup igual): un log group con nombre fijo, no atado al ID
  # fisico de la funcion, sobrevive a un reemplazo futuro de esa funcion. Antes de esto,
  # cada reemplazo dejaba el log group anterior huerfano, sin retencion, invisible.
  ConnectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/poker-planning-${Environment}-connect'
      RetentionInDays: !FindInMap [LogRetention, !Ref Environment, Days]

  DisconnectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/poker-planning-${Environment}-disconnect'
      RetentionInDays: !FindInMap [LogRetention, !Ref Environment, Days]

  DefaultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/poker-planning-${Environment}-default'
      RetentionInDays: !FindInMap [LogRetention, !Ref Environment, Days]

  ConnectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - ../apps/realtime-api/src/handlers/connect.ts
        Sourcemap: false
        Target: node24
        Format: cjs
    Properties:
      Handler: connect.handler
      LoggingConfig:
        LogGroup: !Ref ConnectLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomsTable

  DisconnectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - ../apps/realtime-api/src/handlers/disconnect.ts
        Sourcemap: false
        Target: node24
        Format: cjs
    Properties:
      Handler: disconnect.handler
      LoggingConfig:
        LogGroup: !Ref DisconnectLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  DefaultFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - ../apps/realtime-api/src/handlers/default.ts
        Sourcemap: false
        Target: node24
        Format: cjs
    Properties:
      Handler: default.handler
      LoggingConfig:
        LogGroup: !Ref DefaultLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  # Notificacion proactiva: los logs (add-backend-structured-logging) y el tracing
  # (add-backend-tracing) sirven para diagnosticar despues de enterarse de un problema.
  # Esto es lo que avisa que hay que mirar. Un topic por ambiente porque cada ambiente
  # ya es un stack separado, sin recursos compartidos entre si.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'poker-planning-${Environment}-alerts'

  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # Las tres alarmas de Lambda agregan connect+disconnect+default con metric math en vez
  # de una alarma por funcion (9 recursos): con los logs y el tracing ya cubriendo el
  # diagnostico fino, alcanza con saber que alguna de las tres tuvo un problema. SUM para
  # conteos de eventos discretos (Errors, Throttles); MAX para p99 de Duration, porque
  # promediar percentiles entre funciones no tiene sentido estadistico pero el maximo si.
  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'poker-planning-${Environment}-lambda-errors'
      AlarmDescription: Errores combinados de connect+disconnect+default por encima del umbral del ambiente.
      Metrics:
        - Id: connectErrors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ConnectFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: disconnectErrors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DisconnectFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: defaultErrors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DefaultFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: totalErrors
          Expression: 'connectErrors + disconnectErrors + defaultErrors'
          Label: Errores combinados de las tres funciones
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: !FindInMap [AlarmThresholds, !Ref Environment, LambdaErrorsPerFiveMin]
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'poker-planning-${Environment}-lambda-throttles'
      AlarmDescription: Al menos un throttle en connect, disconnect o default. No varia por ambiente.
      Metrics:
        - Id: connectThrottles
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ConnectFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: disconnectThrottles
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DisconnectFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: defaultThrottles
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DefaultFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: totalThrottles
          Expression: 'connectThrottles + disconnectThrottles + defaultThrottles'
          Label: Throttles combinados de las tres funciones
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  LambdaDurationP99Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'poker-planning-${Environment}-lambda-duration-p99'
      AlarmDescription: La mas lenta de las tres funciones supera 5s de p99. No varia por ambiente (mitad del Timeout de 10s).
      Metrics:
        - Id: connectP99
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Duration
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ConnectFunction
            Period: 300
            Stat: p99
          ReturnData: false
        - Id: disconnectP99
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Duration
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DisconnectFunction
            Period: 300
            Stat: p99
          ReturnData: false
        - Id: defaultP99
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Duration
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DefaultFunction
            Period: 300
            Stat: p99
          ReturnData: false
        - Id: maxP99
          Expression: 'MAX([connectP99, disconnectP99, defaultP99])'
          Label: p99 mas alto de las tres funciones
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # IntegrationError es el equivalente funcional a "5xx" para un WebSocket API: X-Ray y
  # este namespace de metricas tratan las WebSocket APIs distinto de las REST/HTTP APIs,
  # que si tienen una metrica "5xx" dedicada. Ver add-backend-alarms/design.md.
  ApiGatewayIntegrationErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'poker-planning-${Environment}-apigw-integration-errors'
      AlarmDescription: Errores 4XX/5XX devueltos por la integracion del WebSocket API, por encima del umbral del ambiente.
      Namespace: AWS/ApiGateway
      MetricName: IntegrationError
      Dimensions:
        - Name: ApiId
          Value: !Ref WebSocketApi
      Period: 300
      Statistic: Sum
      EvaluationPeriods: 1
      Threshold: !FindInMap [AlarmThresholds, !Ref Environment, IntegrationErrorsPerFiveMin]
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

Outputs:
  WebSocketUrl:
    Description: WebSocket connection URL
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${WebSocketStage}
  TableName:
    Value: !Ref RoomsTable
