AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Planning Poker - WebSocket API + Lambda + DynamoDB

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - prod
    Description: >
      Ambiente de despliegue. Determina el nombre físico de la tabla DynamoDB,
      la API Gateway y el stage, para evitar colisiones de nombre entre los
      stacks de dev/qa/prod en la misma cuenta y región. El sufijo aplica por
      igual a los 3 ambientes, incluido "dev" — desplegar este cambio sobre el
      stack dev ya existente reemplaza su tabla DynamoDB (TableName es una
      propiedad create-only en CloudFormation, no se puede renombrar in-place),
      lo cual borra las salas que existan en ese momento. Aceptado a propósito:
      las salas son efímeras (TTL, sin historial entre sesiones).

Mappings:
  LogRetention:
    dev:
      Days: 7
    qa:
      Days: 7
    prod:
      Days: 14

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref RoomsTable
        DYNAMODB_ENDPOINT: ''

Resources:
  RoomsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'poker-planning-rooms-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'poker-planning-ws-${Environment}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub 'integrations/${ConnectIntegration}'

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations

  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${DisconnectIntegration}'

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub 'integrations/${DefaultIntegration}'

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DefaultFunction.Arn}/invocations

  DefaultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DefaultFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  # Un log group por funcion, declarado como recurso propio del stack. No es solo para
  # fijar la retencion (SAM no tiene atajo para eso en AWS::Serverless::Function, hay que
  # declarar el AWS::Logs::LogGroup igual): un log group con nombre fijo, no atado al ID
  # fisico de la funcion, sobrevive a un reemplazo futuro de esa funcion. Antes de esto,
  # cada reemplazo dejaba el log group anterior huerfano, sin retencion, invisible.
  ConnectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/poker-planning-${Environment}-connect'
      RetentionInDays: !FindInMap [LogRetention, !Ref Environment, Days]

  DisconnectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/poker-planning-${Environment}-disconnect'
      RetentionInDays: !FindInMap [LogRetention, !Ref Environment, Days]

  DefaultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/poker-planning-${Environment}-default'
      RetentionInDays: !FindInMap [LogRetention, !Ref Environment, Days]

  ConnectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - ../apps/realtime-api/src/handlers/connect.ts
        Sourcemap: false
        Target: node24
        Format: cjs
    Properties:
      Handler: connect.handler
      LoggingConfig:
        LogGroup: !Ref ConnectLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomsTable

  DisconnectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - ../apps/realtime-api/src/handlers/disconnect.ts
        Sourcemap: false
        Target: node24
        Format: cjs
    Properties:
      Handler: disconnect.handler
      LoggingConfig:
        LogGroup: !Ref DisconnectLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  DefaultFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - ../apps/realtime-api/src/handlers/default.ts
        Sourcemap: false
        Target: node24
        Format: cjs
    Properties:
      Handler: default.handler
      LoggingConfig:
        LogGroup: !Ref DefaultLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

Outputs:
  WebSocketUrl:
    Description: WebSocket connection URL
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${WebSocketStage}
  TableName:
    Value: !Ref RoomsTable
